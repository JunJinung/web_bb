<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    let number = prompt('성적을 입력하세요.');
    if (number >= 90) {
        alert ('A 입니다');
    } else if (number >= 80) {
        alert ('B 입니다');
    } else if (number >= 70) {
        alert ('C 입니다');
    } else if (number >= 60) {
        alert ('D 입니다');
    } else {
        alert ('F 입니다');
    }
</script>
<body>
    <h1> if else 조건문</h1>
</body>
</html>
