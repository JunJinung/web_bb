<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    let number = prompt('성적을 입력하세요.');
    switch(parseInt(number/10)) {
        case 10:
        case 9:
            alert("A 입니다");
            break;
        case 8:
            alert("B 입니다");
            break;
        case 7:
            alert("C 입니다");
            break;
        case 6:
            alert("D 입니다");
            break;
        default:
            alert("F 입니다") 
    }
</script>
<body>
    <h1> switch case문 </h1>
</body>
</html>
