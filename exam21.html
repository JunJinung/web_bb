<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    h1 {text-align: center;}
    .disp {width: 205px; height: 40px; margin-top: 3px;}
    .disp {text-align: right; font-family: "oxanium", sans-serif; font-size: 22pt;}
    input[type = button] {width: 50px; height: 50px; margin-top: 5px; text-align: center; vertical-align: middle;}
    #calc {width: 220px; margin-left: auto; margin-right: auto;}
</style>
<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
<script>
    $(document).ready(function(){
        // 1. 숫자 버튼 클릭
        $(".num").click(function(){
            let cur = $("#disp2").val();
            let n = $(this).val();
            $("#disp2").val(cur + n);
        });

        // 2. 연산자 및 '=' 버튼 클릭
        $(".op").click(function(){
            let cur = $("#disp2").val();
            let n = $(this).val();

            if (n !== "=") {
                $("#disp2").val(cur + n);
            } else {
                let result = calculate(cur);
                $("#disp1").val(cur);
                $("#disp2").val(result);
            }
        });

        // 3. AC 버튼 클릭 (초기화)
        $(".func").click(function(){
            $("#disp1").val("");
            $("#disp2").val("");
        });

        // eval() 없이 직접 사칙연산을 수행하는 함수
        function calculate(expr) {
            let tokens = expr.match(/\d+|\+|\-|\*|\//g);
            if (!tokens) return 0;

            // 1단계: 곱셈(*), 나눗셈(/) 먼저 처리
            let stack = [];
            for (let i = 0; i < tokens.length; i++) {
                let token = tokens[i];
                if (token === "*" || token === "/") {
                    let prev = Number(stack.pop());
                    let next = Number(tokens[++i]);
                    let res = (token === "*") ? prev * next : prev / next;
                    stack.push(res);
                } else {
                    stack.push(token);
                }
            }

            // 2단계: 덧셈(+), 뺄셈(-) 처리
            let result = Number(stack[0]);
            for (let i = 1; i < stack.length; i += 2) {
                let op = stack[i];
                let next = Number(stack[i + 1]);
                if (op === "+") result += next;
                else if (op === "-") result -= next;
            }

            return result;
        }
    });
</script>
<body>
    <h1>계산기</h1>
    <div id = "calc">
        <div>
            <input type = "text" class = "disp" id = "disp1" readonly>
            <input type = "text" class = "disp" id = "disp2" readonly>
        </div>
        <input type = "button" class = "num" value = "7">
        <input type = "button" class = "num" value = "8">
        <input type = "button" class = "num" value = "9">
        <input type = "button" class = "op" value = "+"> <br>
        <input type = "button" class = "num" value = "4">
        <input type = "button" class = "num" value = "5">
        <input type = "button" class = "num" value = "6">
        <input type = "button" class = "op" value = "-"> <br>
        <input type = "button" class = "num" value = "1">
        <input type = "button" class = "num" value = "2">
        <input type = "button" class = "num" value = "3">
        <input type = "button" class = "op" value = "*"> <br>
        <input type = "button" class = "func" value = "ac">
        <input type = "button" class = "num" value = "0">
        <input type = "button" class = "op" value = "=">
        <input type = "button" class = "op" value = "/"> <br>
    </div>
</body>
</html>
