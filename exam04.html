<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>목록 태그</title>
</head>
<body>
    <h1>글머리 기호 목록</h1>
    <ul type = "circle">
        <li>html</li>
        <li>css</li>
        <li>js</li>
    </ul>
    <h1>순서 번호 목록</h1>
    <ol type = "i">
        <li>html</li>
        <li>css</li>
        <li>js</li>
    </ol>
    <h1>정의 목록</h1>
    <dl>
        <dt>프론트앤드</dt>
        <dd>html</dd>
        <dd>scc</dd>
        <dd>js</dd>
        <dt>백앤드</dt>
        <dd>node.js</dd>
        <dd>mysql</dd>
    </dl>
</body>
</html>
